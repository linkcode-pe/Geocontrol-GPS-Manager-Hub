name: Hub verification
on:
  push:
    branches: [feat/mysql-auth, main]
  pull_request:
    branches: [feat/mysql-auth, main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          AUTH_SECRET: ${{ secrets.HUB_CI_AUTH_SECRET }}
